# Push-gate settings read by ~/.claude/githooks/pre-push, which
# .githooks/pre-push hands off to. A key in the clone's own git config wins.
[ants "gate"]
	# Docs-only test, from ci.yml's own on.push.paths-ignore so GitHub and
	# the hook share one list. Every pushed path must match; a single other
	# file, or any failure to read the list, makes it a code push.
	docsCommand = python3 tools/ci_docs_only.py
	# A docs-only push runs the secret-scan job only (local-ci.sh --docs).
	docsMode = --docs
	# Run in the real checkout, so the warm build/, build-release/ and
	# msvc-wine trees are reused. A cold build takes about 40 minutes.
	inPlace = true
	# When the pushed tip is not HEAD or the tree is dirty, refuse rather
	# than build cold in a fresh checkout.
	dirtyTree = refuse
