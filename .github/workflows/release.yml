# .github/workflows/release.yml — Vestige release artifact builds.
#
# Triggered by pushing a tag matching v* (e.g. v0.1.4-preview, v1.0.0) or
# by manual workflow_dispatch. Produces:
#   - Linux:   vestige-<version>-linux-x86_64.tar.gz
#   - Linux:   Vestige-<version>-x86_64.AppImage (+ .zsync update file)
#   - Windows: vestige-<version>-windows-x86_64.zip
#   - a <asset>.sig beside the tarball, AppImage and zip: the self-updater's
#     Ed25519 signature (3D_E-0729, tools/sign_release.py)
# and attaches them all to a GitHub Release for the triggering tag. Testers
# (see TESTING.md) get a "download, extract, run" path without a build
# environment.
#
# This workflow is deliberately minimal for the first cut:
#   - x86_64 only. ARM64 (Linux + Windows-on-ARM) is a follow-on.
#   - The tarball is relocatable but assumes the host has working OpenGL
#     4.5 drivers + X11/Wayland/ALSA (which is every modern desktop Linux
#     install). The AppImage — built by the "Build AppImage" step with
#     linuxdeploy + packaging/vestige-editor.desktop — bundles those
#     dependencies into one file and embeds zsync update info, so
#     AppImageUpdate can pull the latest stable release in place.
#   - Windows binary is unsigned. Code-signing needs a cert; out of
#     scope for a pre-1.0 tester build. A SmartScreen warning on first
#     run is expected and documented in TESTING.md.
#   - VESTIGE_FETCH_ASSETS=OFF matches CI — the shipped demo assets in
#     assets/ are CC0 and redistributable; VestigeAssets (the larger 4K
#     pack) stays private until v1.0.0.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.1.4-preview). Must already exist."
        required: true
        type: string

concurrency:
  # Serialise release runs for a given tag. A manual re-run of the same
  # tag cancels the in-flight one rather than racing for the upload.
  #
  # Key on the TAG being built. Each trigger carries it under a different
  # name: workflow_dispatch passes inputs.version, and a tag push has it in
  # github.ref. Both are listed so two manual builds of different tags do not
  # cancel each other.
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: true

# Default to nothing at the workflow level; each job requests exactly what it
# needs. A workflow-level grant is inherited by every job, including any added
# later, which is what makes the broad form a standing risk rather than a
# one-off one.
permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Linux x86_64 — tarball.
  # ─────────────────────────────────────────────────────────────────────
  linux-release:
    name: Linux x86_64 tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      # Needed for softprops/action-gh-release to create / update releases.
      # Nothing else. No `security-events`, no `id-token`.
      contents: write
    steps:
      - name: Checkout
        # No submodules in this repo (verified 2026-05-18); `submodules: recursive`
        # was wasted IO. Same drop applied to ci.yml in c768aff.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          # For workflow_dispatch runs, the checked-out ref is the
          # branch default (usually main); pin to the requested tag so
          # the built binary actually carries the tagged source.
          ref: ${{ inputs.version || github.ref }}
          # The release upload uses GITHUB_TOKEN via the release action's own
          # env, not the checkout credentials, so these need not persist.
          persist-credentials: false

      - name: Install build dependencies
        # Plain apt-get, NOT awalsh128/cache-apt-pkgs-action: that action is
        # broken on the current ubuntu-24.04 runner — its manifest parser errors
        # ("substring expression < 0"), installs 0 packages, then caches the
        # empty result (poisoning every later run). Release runs are rare (tag
        # pushes), so the lost cache is a few seconds; correctness wins.
        # desktop-file-utils provides desktop-file-validate for the AppImage
        # step; patchelf rewrites the tarball rpath.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libcurl4-openssl-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            patchelf desktop-file-utils

      # zizmor: cache-poisoning (low confidence) — REVIEWED AND KEPT, 3D_E-0635.
      # Decision 2026-09-21. The trade is real: dropping the cache makes these
      # builds hermetic and costs several minutes on every release. Kept because
      # the key is namespaced away from ci.yml's
      # (release-cmake-deps-linux-*) and this workflow only runs on
      # maintainer-gated tag pushes or workflow_call,
      # so poisoning the entry needs the same write access as
      # poisoning anything else in the repo.
      # Re-open this if either premise stops holding: a shared key prefix, or a
      # trigger reachable without maintainer access.
      - name: Cache CMake FetchContent deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: |
            build/_deps
          key: release-cmake-deps-linux-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            release-cmake-deps-linux-

      - name: Resolve version string
        id: version
        env:
          # Passed through the environment, never interpolated into the script
          # body: a ${{ }} expansion inside `run:` is substituted before the
          # shell sees it, so a crafted dispatch input would execute here.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Strip refs/tags/ prefix; fall back to VERSION file for
          # manual dispatch that forgot the input.
          # Resolve the tag from whichever trigger fired: workflow_dispatch →
          # inputs.version; tag push → the ref.
          # VERSION file is the last-resort fallback.
          TAG="$INPUT_VERSION"
          if [ -z "$TAG" ]; then
            T="${GITHUB_REF#refs/tags/}"
            [ "$T" != "$GITHUB_REF" ] && TAG="$T"
          fi
          [ -z "$TAG" ] && TAG="v$(cat VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Configure (Release)
        env:
          # 3D_E-0683: the version stamped into saved scenes is the tag
          # this release is built for, not the project(VERSION) baseline.
          VERSION_STAMP: ${{ steps.version.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVESTIGE_FETCH_ASSETS=OFF \
            -DVESTIGE_VERSION_STAMP="$VERSION_STAMP" \
            -DVESTIGE_PACKAGE=linux

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Stage release tree
        # Build a relocatable directory:
        #   vestige-<ver>-linux-x86_64/
        #     vestige, vestige-editor           (binary + wrapper)
        #     lib/libopenal.so.1*, ...          (bundled shared libs)
        #     assets/                           (CC0 demo assets)
        #     LICENSE, README.md, TESTING.md, THIRD_PARTY_NOTICES.md, ASSET_LICENSES.md
        # rpath on vestige is set to $ORIGIN/lib so the bundled .so's
        # are found without the user touching LD_LIBRARY_PATH.
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          STAGE="vestige-${VER}-linux-x86_64"
          mkdir -p "$STAGE/lib" "$STAGE/assets"

          # Engine binary and editor wrapper. Names come from
          # engine/CMakeLists.txt and packaging/vestige-editor.sh.
          cp build/bin/vestige "$STAGE/"
          cp packaging/vestige-editor.sh "$STAGE/vestige-editor"
          chmod +x "$STAGE/vestige-editor"

          # Bundle OpenAL Soft (LGPL — must be dynamically linked) and
          # any other FetchContent-built .so's that end up next to the
          # binary. GLFW and GLM are static-linked so nothing to copy.
          if [ -d build/_deps/openal-soft-build ]; then
            find build/_deps/openal-soft-build -maxdepth 3 -name 'libopenal.so*' -exec cp -av {} "$STAGE/lib/" \;
          fi
          # Repoint the binary's RUNPATH so the bundled .so is found.
          # SC2016 is a FALSE POSITIVE here and must not be "fixed": $ORIGIN is
          # expanded by the dynamic linker at load time, not by the shell, so it
          # has to reach patchelf literally. Double-quoting would expand it to
          # the empty string and every shipped Linux tarball would fail to find
          # its bundled libopenal at runtime.
          # shellcheck disable=SC2016
          patchelf --set-rpath '$ORIGIN/lib' "$STAGE/vestige"

          # Shipped demo assets + license/notice docs.
          cp -r assets/. "$STAGE/assets/"
          cp LICENSE README.md TESTING.md THIRD_PARTY_NOTICES.md ASSET_LICENSES.md "$STAGE/"

          # Tarball it. --sort=name + --mtime for reproducibility.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -czf "${STAGE}.tar.gz" "$STAGE"
          ls -lh "${STAGE}.tar.gz"

      - name: Build AppImage
        # Single-file, sandbox-free Linux build with embedded zsync update info,
        # so AppImageUpdate / a self-updater can pull the latest STABLE release.
        # The AppRun launcher passes --assets pointing inside the AppImage, so it
        # finds its assets from any working directory (the engine is cwd-relative).
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          export APPIMAGE_EXTRACT_AND_RUN=1   # GitHub runners have no FUSE

          # Pinned packaging tools (bump deliberately, per CLAUDE.md Rule 8).
          curl -fsSL --retry 3 -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          curl -fsSL --retry 3 -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy appimagetool

          # Assemble the AppDir: binary + bundled assets + desktop + icon + AppRun.
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/vestige" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/vestige "$APPDIR/usr/bin/"
          cp -r assets "$APPDIR/usr/share/vestige/assets"
          cp packaging/vestige.desktop "$APPDIR/usr/share/applications/vestige.desktop"
          cp packaging/vestige.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/vestige.png"
          cp packaging/AppRun "$APPDIR/AppRun"; chmod +x "$APPDIR/AppRun"
          cp LICENSE README.md TESTING.md THIRD_PARTY_NOTICES.md ASSET_LICENSES.md "$APPDIR/usr/share/vestige/"

          # Bundle shared-lib deps (OpenAL Soft, etc.) + patch rpath. --custom-apprun
          # keeps our launcher (which passes --assets) instead of the default.
          ./linuxdeploy --appdir "$APPDIR" \
            -d packaging/vestige.desktop \
            -i packaging/vestige.png \
            --custom-apprun packaging/AppRun

          # Package with embedded update info. The zsync glob matches the
          # versioned asset name; "latest" tracks the newest non-prerelease.
          OUT="Vestige-${VER}-x86_64.AppImage"
          ./appimagetool \
            -u "gh-releases-zsync|milnet01|Vestige|latest|Vestige-*-x86_64.AppImage.zsync" \
            "$APPDIR" "$OUT"
          ls -lh "$OUT" "${OUT}.zsync"

      # 3D_E-0729: sign every asset the self-updater may download, then verify
      # each signature against the public key compiled into the engine
      # (engine/update/update_key.h) so a mismatched secret fails here.
      - name: Sign release assets
        env:
          VESTIGE_UPDATE_SIGNING_KEY: ${{ secrets.VESTIGE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          python3 -m venv /tmp/signenv
          /tmp/signenv/bin/pip install --quiet cryptography==50.0.1
          FILES=(vestige-*-linux-x86_64.tar.gz Vestige-*-x86_64.AppImage)
          /tmp/signenv/bin/python tools/sign_release.py --version "$VER" "${FILES[@]}"
          /tmp/signenv/bin/python tools/sign_release.py --verify --version "$VER" "${FILES[@]}"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: vestige-linux-x86_64
          path: |
            vestige-*-linux-x86_64.tar.gz
            vestige-*-linux-x86_64.tar.gz.sig
            Vestige-*-x86_64.AppImage
            Vestige-*-x86_64.AppImage.sig
            Vestige-*-x86_64.AppImage.zsync
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(steps.version.outputs.tag, 'v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            vestige-*-linux-x86_64.tar.gz
            vestige-*-linux-x86_64.tar.gz.sig
            Vestige-*-x86_64.AppImage
            Vestige-*-x86_64.AppImage.sig
            Vestige-*-x86_64.AppImage.zsync
          # Attached to a DRAFT: this job and the Windows job upload
          # separately, and a release made public by whichever finishes first
          # would offer users an update with half its downloads missing. The
          # publish job below makes it public once both have finished.
          # A tag carrying "-rc" is not part of the release process
          # (RELEASING.md), but if one is pushed it is marked a pre-release so
          # it can never become Latest.
          draft: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') }}
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ─────────────────────────────────────────────────────────────────────
  # Windows x86_64 — ZIP.
  # ─────────────────────────────────────────────────────────────────────
  windows-release:
    name: Windows x86_64 zip
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      # Needed for softprops/action-gh-release to create / update releases.
      contents: write
    steps:
      - name: Checkout
        # No submodules in this repo; same drop applied in c768aff.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false

      # zizmor: cache-poisoning (low confidence) — REVIEWED AND KEPT, 3D_E-0635.
      # Decision 2026-09-21. The trade is real: dropping the cache makes these
      # builds hermetic and costs several minutes on every release. Kept because
      # the key is namespaced away from ci.yml's
      # (release-cmake-deps-windows-*) and this workflow only runs on
      # maintainer-gated tag pushes or workflow_call,
      # so poisoning the entry needs the same write access as
      # poisoning anything else in the repo.
      # Re-open this if either premise stops holding: a shared key prefix, or a
      # trigger reachable without maintainer access.
      - name: Cache CMake FetchContent deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: |
            build/_deps
          key: release-cmake-deps-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            release-cmake-deps-windows-

      - name: Resolve version string
        id: version
        shell: bash
        env:
          # Passed through the environment, never interpolated into the script
          # body: a ${{ }} expansion inside `run:` is substituted before the
          # shell sees it, so a crafted dispatch input would execute here.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Resolve the tag from whichever trigger fired: workflow_dispatch →
          # inputs.version; tag push → the ref.
          # VERSION file is the last-resort fallback.
          TAG="$INPUT_VERSION"
          if [ -z "$TAG" ]; then
            T="${GITHUB_REF#refs/tags/}"
            [ "$T" != "$GITHUB_REF" ] && TAG="$T"
          fi
          [ -z "$TAG" ] && TAG="v$(cat VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Configure (Release)
        # Default MSVC generator on windows-2022 is VS 2022. No Ninja
        # here — the VS generator is less fussy about the first-time
        # FetchContent build on MSVC.
        env:
          # 3D_E-0683: the version stamped into saved scenes is the tag
          # this release is built for, not the project(VERSION) baseline.
          VERSION_STAMP: ${{ steps.version.outputs.version }}
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DVESTIGE_FETCH_ASSETS=OFF `
            -DVESTIGE_VERSION_STAMP="$env:VERSION_STAMP" `
            -DVESTIGE_PACKAGE=windows-zip

      - name: Build
        run: cmake --build build --config Release -j

      - name: Stage release tree
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          STAGE="vestige-${VER}-windows-x86_64"
          mkdir -p "$STAGE/assets"

          # MSVC multi-config generator writes Release output to
          # build/bin/Release/ (or build/Release/ depending on version);
          # find the exe and copy it + any sibling DLLs.
          EXE="$(find build -maxdepth 4 -iname 'vestige.exe' | head -1)"
          test -n "$EXE"
          EXE_DIR="$(dirname "$EXE")"
          cp "$EXE" "$STAGE/"
          # Copy every DLL that ended up next to the .exe (OpenAL Soft,
          # anything else that built SHARED). CMake/MSBuild puts them
          # there when the target lists them as runtime deps.
          find "$EXE_DIR" -maxdepth 1 -iname '*.dll' -exec cp -v {} "$STAGE/" \;

          # Shipped assets + license docs.
          cp -r assets/. "$STAGE/assets/"
          cp LICENSE README.md TESTING.md THIRD_PARTY_NOTICES.md ASSET_LICENSES.md "$STAGE/"

          # Windows testers double-click the .exe, but a tiny .cmd
          # wrapper helps when they want an obvious "launch" entry.
          cat > "$STAGE/vestige-editor.cmd" <<'EOF'
          @echo off
          "%~dp0vestige.exe" %*
          EOF

          # Use PowerShell's Compress-Archive via cmd so we get a real
          # zip with Windows-friendly path separators.
          powershell -NoProfile -Command "Compress-Archive -Path '$STAGE' -DestinationPath '${STAGE}.zip' -Force"
          ls -lh "${STAGE}.zip"

      # 3D_E-0729: see the Linux job's signing step.
      - name: Sign release assets
        shell: bash
        env:
          VESTIGE_UPDATE_SIGNING_KEY: ${{ secrets.VESTIGE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          python -m pip install --quiet cryptography==50.0.1
          python tools/sign_release.py --version "$VER" vestige-*-windows-x86_64.zip
          python tools/sign_release.py --verify --version "$VER" vestige-*-windows-x86_64.zip

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: vestige-windows-x86_64
          path: |
            vestige-*-windows-x86_64.zip
            vestige-*-windows-x86_64.zip.sig
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(steps.version.outputs.tag, 'v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            vestige-*-windows-x86_64.zip
            vestige-*-windows-x86_64.zip.sig
          # A draft until the publish job runs: see the linux-release attach step.
          draft: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') }}
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ─────────────────────────────────────────────────────────────────────
  # Publish — make the draft public once every download is attached.
  # No manual click: a release is public as soon as it is complete
  # (RELEASING.md). If either build fails this job does not run and the
  # draft stays private.
  # ─────────────────────────────────────────────────────────────────────
  publish:
    name: Publish the release
    needs: [linux-release, windows-release]
    if: startsWith(needs.linux-release.outputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Needed to edit the release. Nothing else.
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.linux-release.outputs.tag }}
        run: |
          case "$TAG" in
            *-rc*) gh release edit "$TAG" --draft=false --prerelease ;;
            *)     gh release edit "$TAG" --draft=false --latest ;;
          esac
