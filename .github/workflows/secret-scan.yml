# Secret scan: gitleaks over the full git history, on every push.
#
# Its own workflow so it keeps running on documentation-only pushes, which
# ci.yml skips through paths-ignore (3D_E-0709): a secret can be pasted into a
# README as easily as into code. Mirrored locally by scripts/local-ci.sh
# stage 5 and by local-ci.sh --docs, and the push hook scans the pushed range.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Secret-scanning job — runs gitleaks against the repo and the full
  # git history every push and PR. Catches accidentally-committed
  # credentials before they reach public mirrors / caches. Uses the
  # committed .gitleaks.toml so the allowlist stays in lockstep with
  # the local pre-commit config. Non-blocking on forks (secret_scan is
  # a separate job, so a fork's PR can still land the rest of CI if
  # this job hits a transient download failure).
  #
  # Uses the gitleaks CLI directly rather than the gitleaks-action
  # wrapper. Rationale: (1) the JS action is pinned to Node 20 which
  # GitHub is deprecating (September 2026 removal); (2) the CLI is MIT
  # while the JS action has a custom commercial-use clause; (3) direct
  # version pinning + faster cold start. See PHASE10 commit msg for
  # migration context.
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pinned version — bump deliberately, not via a floating tag.
      # Matches the pattern used for other tool downloads in this file.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          # gitleaks detect walks the full git history; shallow clone
          # would miss older commits that could contain leaked secrets.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          # Scan full history. --redact masks any discovered secret in
          # the log output so the CI log itself never exposes the
          # leaked value. --exit-code 1 makes the step (and the job)
          # fail when any finding is reported; the committed
          # .gitleaks.toml allowlists known-benign matches. A failing
          # job turns CI red — that's the signal the committer needs.
          # We deliberately do NOT upload SARIF to the Security tab:
          # the old gitleaks-action didn't either, and doing so would
          # require `security-events: write` on the workflow token
          # plus pull in an upload-sarif action (which is itself
          # Node-20-deprecated). Keep the job minimal.
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1
